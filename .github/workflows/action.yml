# Builds sjultra/speedtest at the version in helm/service/Chart.yaml (appVersion).
# Manual only: bump appVersion (and the chart's version), commit, then run this.
# A version that's already published is never overwritten.

name: Build and push docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # GHCR push with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: sjultra/speedtest
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/speedtest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(yq '.appVersion' helm/service/Chart.yaml)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::appVersion is missing from helm/service/Chart.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version
        id: check
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:${{ steps.version.outputs.version }} is already published; bump appVersion in helm/service/Chart.yaml to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.published == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.published == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
