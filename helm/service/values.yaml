# Default values for Speedtest chart.
# Update these values according to your requirements.

influxdb:
  image:
    repository: influxdb
    tag: "1.8.10"                         # pinned (not `latest`)
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: password
  db: speedtest                           # created on first start

  # deployment target(s)
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity: {}
  tolerations: []

grafana:
  image:
    repository: grafana/grafana
    tag: "6.7.2"                          # pinned (not `latest`)
    pullPolicy: IfNotPresent
  adminPassword: admin
  rootUrl: ""                             # set only if Grafana must know its public URL; unset, it works at any URL
  service:
    nodePort: 30081                       # LAN access: http://<any-node-ip>:30081
  ingress:
    enabled: false                        # true = public at https://<host>; TLS is terminated by nginx on the proxy host
    host: ""                              # required when enabled

  # deployment target(s)
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity: {}
  tolerations: []

speedtest:
  image:
    repository: sjultra/speedtest
    tag: ""                               # defaults to the chart's appVersion; set only to override
    pullPolicy: IfNotPresent
  interval: 60
  host: ""

  # deployment target(s)
  nodeSelector:
    kubernetes.io/arch: amd64             # the image is amd64-only
  affinity: {}
  tolerations: []
