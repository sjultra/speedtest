apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedtest
  template:
    metadata:
      labels:
        app: speedtest
    spec:
      {{- with .Values.speedtest.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.speedtest.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.speedtest.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: influxdb-wait
          image: busybox:1.34.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nslookup influxdb; do sleep 2; done"]
      containers:
        - name: speedtest
          image: "{{ .Values.speedtest.image.repository }}:{{ .Values.speedtest.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.speedtest.image.pullPolicy }}
          env:
            - name: SPEEDTEST_INTERVAL
              value: "{{ .Values.speedtest.interval }}"
            - name: SPEEDTEST_HOST
              value: "{{ .Values.speedtest.host }}"
